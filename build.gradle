apply from: "https://raw.githubusercontent.com/toolarium/common-gradle-build/master/gradle/common.gradle"


/************************************************************************************************************************
 * Define project dependencies
 ************************************************************************************************************************/
dependencies {
    // logging
    implementation "org.slf4j:slf4j-api:${commonGradleSlf4jApiVersion}"
    testImplementation "ch.qos.logback:logback-classic:${commonGradleLogbackVersion}"

    // core changelog library
    implementation "com.github.toolarium:toolarium-db-changelog:0.8.0"

    // resolve javadoc warnings for transitive Jackson annotations
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:2.18.2"

    // Spring Boot auto-configuration
    implementation "org.springframework.boot:spring-boot-autoconfigure:2.7.18"

    // Spring Boot actuator (optional)
    compileOnly "org.springframework.boot:spring-boot-actuator-autoconfigure:2.7.18"

    // Spring Boot annotation processor for configuration metadata
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:2.7.18"

    // testing
    testImplementation "org.springframework.boot:spring-boot-starter-test:2.7.18"
    testImplementation "org.springframework.boot:spring-boot-actuator-autoconfigure:2.7.18"
    testImplementation "com.h2database:h2:2.4.240"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc:2.7.18"
}
